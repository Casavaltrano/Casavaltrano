<!DOCTYPE html>  
<html lang="nl">  
<head>  
  <meta charset="UTF-8">  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  
  <title>Casa Valtrano - HQ</title>  
  <style>  
    :root {  
      --bg-color: #05080e;  
      --card-bg: rgba(15, 23, 42, 0.75);  
      --border: #1e293b;  
      --accent-blue: #2563eb;  
      --accent-cyan: #38bdf8;  
      --accent-gold: #d97706;  
      --text: #f8fafc;  
      --text-muted: #94a3b8;  
      --danger: #ef4444;  
      --success: #22c55e;  
    }  
  
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }  
  
    body {  
      background: radial-gradient(circle at top, #0f172a 0%, #05080e 100%);  
      color: var(--text);  
      padding: 15px;  
      min-height: 100vh;  
    }  
  
    .page { display: none; max-width: 950px; margin: 0 auto; animation: fadeIn 0.3s ease; }  
    .page.active { display: block; }  
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }  
  
    /* HEADER & LOGO */  
    .home-container { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 85vh; text-align: center; }  
      
    .logo-box {  
      width: 160px;  
      height: 160px;  
      border-radius: 20px;  
      border: 2px solid rgba(56, 189, 248, 0.3);  
      box-shadow: 0 0 35px rgba(37, 99, 235, 0.35);  
      margin-bottom: 20px;  
      overflow: hidden;  
      background: #0f172a;  
      display: flex;  
      align-items: center;  
      justify-content: center;  
    }  
    .logo-img { width: 100%; height: 100%; object-fit: cover; border: none; }  
  
    .gang-title { font-size: 2.5rem; color: var(--text); font-weight: 900; letter-spacing: 3px; text-transform: uppercase; text-shadow: 0 0 20px rgba(56, 189, 248, 0.2); }  
    .gang-subtitle { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 35px; letter-spacing: 2px; text-transform: uppercase; }  
  
    /* BUTTONS & CARDS */  
    .menu-buttons { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 340px; }  
    .main-btn {  
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.8) 0%, rgba(15, 23, 42, 0.9) 100%);  
      border: 1px solid var(--border);  
      color: var(--text);  
      padding: 16px 22px;  
      border-radius: 12px;  
      font-size: 1.05rem;  
      font-weight: 700;  
      cursor: pointer;  
      transition: all 0.25s ease;  
      display: flex;  
      align-items: center;  
      justify-content: space-between;  
      backdrop-filter: blur(10px);  
    }  
    .main-btn:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.5); }  
  
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }  
    .back-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text-muted); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; }  
    .back-btn:hover { color: var(--text); border-color: var(--accent-cyan); }  
    .header-title { font-size: 1.3rem; color: var(--text); font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }  
  
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 22px; margin-bottom: 20px; backdrop-filter: blur(10px); }  
  
    input, textarea, button { font-size: 0.9rem; }  
    input[type="text"], input[type="number"], textarea {  
      background: #090d16;  
      border: 1px solid var(--border);  
      color: var(--text);  
      padding: 10px;  
      border-radius: 8px;  
      width: 100%;  
      outline: none;  
    }  
    input:focus, textarea:focus { border-color: var(--accent-cyan); }  
  
    .btn-action { background: var(--accent-blue); color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.2s; }  
    .btn-action:hover { opacity: 0.9; }  
    .btn-danger { background: rgba(239, 68, 68, 0.2); border: 1px solid var(--danger); color: var(--danger); }  
    .btn-danger:hover { background: var(--danger); color: white; }  
  
    /* GROEPSPOT STYLES */  
    .pot-row { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; background: rgba(9, 13, 22, 0.6); padding: 10px; border-radius: 8px; border: 1px solid var(--border); }  
    .pot-row input[type="text"] { flex: 2; }  
    .pot-row input[type="number"] { flex: 1.5; }  
    .status-badge { flex: 2; font-weight: bold; font-size: 0.88rem; padding: 6px 10px; border-radius: 6px; display: flex; align-items: center; gap: 6px; }  
    .status-ok { background: rgba(34, 197, 94, 0.15); color: var(--success); border: 1px solid var(--success); }  
    .status-nok { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid var(--danger); }  
  
    /* SWAM RATIO STYLES */  
    .swam-card { border: 1px solid var(--border); background: rgba(9, 13, 22, 0.8); padding: 15px; border-radius: 10px; margin-bottom: 15px; }  
    .swam-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }  
  
    /* GANGBEZIT STYLES */  
    .cat-box { border: 1px solid var(--border); background: rgba(9, 13, 22, 0.8); padding: 18px; border-radius: 12px; margin-bottom: 20px; }  
    .cat-header { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }  
    .item-row { display: flex; gap: 10px; margin-top: 10px; align-items: center; }  
    .item-row input[type="text"] { flex: 3; }  
    .item-row input[type="number"] { flex: 1; }  
  </style>  
</head>  
<body>  
  
  <!-- HOME PAGE -->  
  <div id="page-home" class="page active">  
    <div class="home-container">  
      <!-- LOGO -->  
      <div class="logo-box">  
        <img id="logoImg" class="logo-img" src="file_00000000286c82109f46fb3bb779a68b.png" alt="Logo" onerror="this.onerror=null; this.src='https://via.placeholder.com/160/0f172a/38bdf8?text=CASA+VALTRANO';">  
      </div>  
      <h1 class="gang-title">Casa Valtrano</h1>  
      <p class="gang-subtitle">HQ & Control Panel</p>  
        
      <div class="menu-buttons">  
        <button class="main-btn" onclick="switchTab('page-gangpot')"><span>Groepspot</span><span>→</span></button>  
        <button class="main-btn" onclick="switchTab('page-swammen')"><span>Swammen / Ratio's</span><span>→</span></button>  
        <button class="main-btn" onclick="switchTab('page-loods')"><span>Loods Beheer</span><span>→</span></button>  
        <button class="main-btn" onclick="switchTab('page-gangbezit')"><span>Gangbezit</span><span>→</span></button>  
        <button id="adminLoginBtn" class="main-btn" style="border-color: var(--accent-gold); color: var(--accent-gold); margin-top: 15px;" onclick="showLoginModal()"><span>Inloggen CasaValtrano</span><span>🔒</span></button>  
      </div>  
    </div>  
  </div>  
  
  <!-- INLOG MODAL -->  
  <div id="loginOverlay" style="position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(5, 8, 14, 0.9); z-index:99999; display:none; justify-content:center; align-items:center;">  
    <div style="background:#0f172a; padding:35px; border-radius:16px; border:1px solid #1e293b; text-align:center; max-width:380px; width:90%; box-shadow:0 0 40px rgba(0,0,0,0.8);">  
      <h2 style="color:var(--accent-cyan); font-size:24px; font-weight:800; margin-bottom:6px; letter-spacing:1px;">CASA VALTRANO</h2>  
      <p style="color:var(--text-muted); font-size:13px; margin-bottom:25px;">Admin Toegang</p>  
      <input type="password" id="passInput" placeholder="Wachtwoord..." onkeypress="if(event.key==='Enter') checkAuth()" style="margin-bottom:15px; text-align:center; font-size:1rem;">  
      <div style="display:flex; gap:10px;">  
        <button onclick="checkAuth()" class="btn-action" style="flex:1; padding:12px;">Inloggen</button>  
        <button onclick="hideLoginModal()" class="btn-action btn-danger" style="flex:1; padding:12px;">Annuleren</button>  
      </div>  
      <p id="authError" style="color:var(--danger); font-size:13px; display:none; margin-top:12px;">Ongeldig wachtwoord!</p>  
    </div>  
  </div>  
  
  <!-- GROEPSPOT PAGE -->  
  <div id="page-gangpot" class="page">  
    <header>  
      <button class="back-btn" onclick="switchTab('page-home')">← Terug</button>  
      <div class="header-title">Groepspot Inleg Overzicht</div>  
      <div></div>  
    </header>  
    <div class="card">  
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">  
        <h3 style="color: var(--accent-cyan);">Leden Inleg Status (Target: $50.000)</h3>  
        <button id="adminAddPotBtn" class="btn-action" style="display:none;" onclick="addPotRow()">+ Lid Toevoegen</button>  
      </div>  
      <div id="pot-rows-container">  
        <!-- Rijen worden dynamisch ingeladen -->  
      </div>  
    </div>  
  </div>  
  
  <!-- SWAMMEN / RATIO PAGE -->  
  <div id="page-swammen" class="page">  
    <header>  
      <button class="back-btn" onclick="switchTab('page-home')">← Terug</button>  
      <div class="header-title">Swammen Ratio Beheer</div>  
      <div></div>  
    </header>  
    <div class="card">  
      <h3 style="color: var(--accent-cyan); margin-bottom: 15px;">Aanpasbare Swam Ratio's</h3>  
      <div id="admin-swam-controls" style="margin-bottom:20px; display:none; gap:10px;">  
        <input type="text" id="newSwamName" placeholder="Naam (bijv. Ratio A)" style="flex:1;">  
        <input type="text" id="newSwamValue" placeholder="Ratio (bijv. 1/2)" style="flex:1;">  
        <button class="btn-action" onclick="addSwamRatio()">+ Ratio Toevoegen</button>  
      </div>  
      <div id="swam-container" class="swam-card">  
        <!-- Swam ratio's worden hier geladen -->  
      </div>  
    </div>  
  </div>  
  
  <!-- LOODS PAGE -->  
  <div id="page-loods" class="page">  
    <header>  
      <button class="back-btn" onclick="switchTab('page-home')">← Terug</button>  
      <div class="header-title">Loods Inventaris</div>  
      <div></div>  
    </header>  
    <div class="card">  
      <h3 style="color: var(--accent-cyan); margin-bottom: 10px;">Materialen & Voorraad</h3>  
      <p style="color: var(--text-muted);">Loods inventarisbeheer overzicht...</p>  
    </div>  
  </div>  
  
  <!-- GANGBEZIT PAGE -->  
  <div id="page-gangbezit" class="page">  
    <header>  
      <button class="back-btn" onclick="switchTab('page-home')">← Terug</button>  
      <div class="header-title">Gangbezit</div>  
      <div></div>  
    </header>  
    <div class="card">  
      <div id="admin-cat-controls" style="margin-bottom: 20px; display:none;">  
        <button class="btn-action" onclick="addCategorie()">+ Categorie Toevoegen</button>  
      </div>  
      <div id="categories-container"></div>  
    </div>  
  </div>  
  
  <script>  
    let currentRole = null;  
  
    // --- SWAM RATIO'S ---  
    let swamRatios = [  
      { id: 1, name: "Standaard Ratio 1", ratio: "1/2" },  
      { id: 2, name: "Standaard Ratio 2", ratio: "1/5" }  
    ];  
  
    // --- GROEPSPOT DATA ---  
    let potData = [  
      { name: "Lid 1", amount: 50000 },  
      { name: "Lid 2", amount: 25000 }  
    ];  
  
    function switchTab(tabId) {  
      document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));  
      const target = document.getElementById(tabId);  
      if (target) target.classList.add('active');  
    }  
  
    function showLoginModal() {  
      document.getElementById('loginOverlay').style.display = 'flex';  
    }  
  
    function hideLoginModal() {  
      document.getElementById('loginOverlay').style.display = 'none';  
      document.getElementById('authError').style.display = 'none';  
    }  
  
    function checkAuth() {  
      const val = document.getElementById('passInput').value.trim();  
      if (val.toLowerCase() === 'valtrano') {  
        currentRole = 'admin';  
        hideLoginModal();  
        document.getElementById('adminLoginBtn').style.display = 'none';  
        document.getElementById('adminAddPotBtn').style.display = 'block';  
        document.getElementById('admin-cat-controls').style.display = 'block';  
        document.getElementById('admin-swam-controls').style.display = 'flex';  
        renderPot();  
        renderSwamRatios();  
      } else {  
        document.getElementById('authError').style.display = 'block';  
      }  
    }  
  
    /* GROEPSPOT LOGICA */  
    function renderPot() {  
      const container = document.getElementById('pot-rows-container');  
      container.innerHTML = '';  
  
      potData.forEach((item, index) => {  
        const row = document.createElement('div');  
        row.className = 'pot-row';  
          
        const target = 50000;  
        const remaining = target - item.amount;  
          
        let statusHtml = '';  
        if (item.amount >= target) {  
          statusHtml = `<div class="status-badge status-ok"><span>✅</span> <span>Voldoen ($${item.amount.toLocaleString()})</span></div>`;  
        } else {  
          statusHtml = `<div class="status-badge status-nok"><span>❌</span> <span>Nog $${remaining.toLocaleString()} te gaan</span></div>`;  
        }  
  
        row.innerHTML = `  
          <input type="text" value="${item.name}" placeholder="Naam lid..." onchange="updatePot(${index}, 'name', this.value)">  
          <input type="number" value="${item.amount}" placeholder="Bedrag in $" oninput="updatePot(${index}, 'amount', this.value)">  
          ${statusHtml}  
          ${currentRole === 'admin' ? `<button class="btn-action btn-danger" onclick="removePotRow(${index})">✕</button>` : ''}  
        `;  
        container.appendChild(row);  
      });  
    }  
  
    function updatePot(index, field, value) {  
      if (field === 'amount') {  
        potData[index].amount = parseFloat(value) || 0;  
      } else {  
        potData[index].name = value;  
      }  
      renderPot();  
    }  
  
    function addPotRow() {  
      if (currentRole !== 'admin') return;  
      potData.push({ name: "", amount: 0 });  
      renderPot();  
    }  
  
    function removePotRow(index) {  
      if (currentRole !== 'admin') return;  
      potData.splice(index, 1);  
      renderPot();  
    }  
  
    /* SWAM RATIO LOGICA */  
    function renderSwamRatios() {  
      const container = document.getElementById('swam-container');  
      container.innerHTML = '';  
  
      if (swamRatios.length === 0) {  
        container.innerHTML = '<p style="color:var(--text-muted);">Geen ratio\'s ingesteld.</p>';  
        return;  
      }  
  
      swamRatios.forEach((item, index) => {  
        const row = document.createElement('div');  
        row.className = 'swam-row';  
        row.innerHTML = `  
          <div>  
            <strong>${item.name}</strong>  
            <span style="color:var(--accent-cyan); font-weight:bold; margin-left:15px; font-size:1.1rem;">${item.ratio}</span>  
          </div>  
          ${currentRole === 'admin' ? `<button class="btn-action btn-danger" onclick="removeSwamRatio(${index})">Verwijderen</button>` : ''}  
        `;  
        container.appendChild(row);  
      });  
    }  
  
    function addSwamRatio() {  
      if (currentRole !== 'admin') return;  
      const nameInput = document.getElementById('newSwamName');  
      const ratioInput = document.getElementById('newSwamValue');  
      if (!nameInput.value || !ratioInput.value) return;  
  
      swamRatios.push({  
        id: Date.now(),  
        name: nameInput.value,  
        ratio: ratioInput.value  
      });  
  
      nameInput.value = '';  
      ratioInput.value = '';  
      renderSwamRatios();  
    }  
  
    function removeSwamRatio(index) {  
      if (currentRole !== 'admin') return;  
      swamRatios.splice(index, 1);  
      renderSwamRatios();  
    }  
  
    // Initiele renders bij opstarten  
    renderPot();  
    renderSwamRatios();  
  </script>  
</body>  
</html>
